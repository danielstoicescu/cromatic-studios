<!-- r141: three sketches for a new opening, side by side, over the live city. Nothing here touches / or /site/:
     the words are this page's own, the cups are the kinetic bundle's wall (data-kz, filled in by the build). -->
<div class="lab" data-kz="">
  <div class="stage">
    <iframe class="city" title="The Cromatic city, live" aria-hidden="true" tabindex="-1"></iframe>
    <canvas class="ghost" aria-hidden="true"></canvas>
    <i class="veil" aria-hidden="true"></i>
    <div class="words" aria-live="polite"></div>
    <div class="kzhost" aria-hidden="true"></div>
    <div class="over" aria-hidden="true"></div>
  </div>
  <header class="bar">
    <span class="mono tag">Intro lab</span>
    <nav class="tabs" aria-label="Sketches">
      <button type="button" data-v="4" aria-pressed="true">04 · The opening</button>
      <button type="button" data-v="1" aria-pressed="false">01 · Parked</button>
    </nav>
    <button type="button" class="replay">Replay</button>
    <button type="button" class="skip">Skip <span aria-hidden="true">→</span></button>
    <span class="mono tc">0.0s</span>
  </header>
  <p class="hint mono">Keys: 4 · 1 · R · S (skip)</p>
</div>
<script src="lab.js" defer></script>
</body>
