<!doctype html>
<html lang="ro"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive"><meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>cromaticstudios.com ops</title>
<link rel="icon" type="image/svg+xml" href="/ops/favicon.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/ops/logo.css">
<link rel="stylesheet" href="/ops/login.css">
</head><body>
<main class="lg" id="lg" data-state="intro">
  <div class="stage" id="stage">
    <span class="cs-y lg-y" aria-hidden="true">cromaticstudios.com</span>
    <h1 class="sr">cromaticstudios.com ops · intră în cont</h1>

    <!-- one element that morphs: filled pill (OPS) -> ring + email -> six code circles -> filled pill again -->
    <div class="pill" id="pill">
      <span class="fill" aria-hidden="true"></span>
      <span class="word" aria-hidden="true">OPS</span>

      <form id="f-email" class="pane pane-email" novalidate>
        <label class="sr" for="email">Emailul tău de la Cromatic</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="emailul tău" required tabindex="-1">
        <button class="go" id="go" type="submit" aria-label="Trimite-mi codul" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
      </form>

      <form id="f-code" class="pane pane-code" novalidate>
        <label class="sr" for="code">Codul de 6 cifre primit pe email</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" aria-describedby="msg" tabindex="-1">
        <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </form>
    </div>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div class="links" id="links">
      <button type="button" class="ln" id="change">schimbă emailul</button>
      <span class="sep" aria-hidden="true">·</span>
      <button type="button" class="ln" id="resend">nu a venit codul? retrimite</button>
    </div>
  </div>
  <p class="hello" id="hello" aria-live="polite"></p>
  <p class="foot">doar pentru echipa Cromatic Studios</p>
</main>
<script src="/ops/login.js"></script>
</body></html>
