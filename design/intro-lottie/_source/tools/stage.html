<!doctype html>
<!-- Cromatic opening · a bare stage for the tools (frames, MP4 renders, benchmarks): the city still under the Lottie.
     ?d=A&ab=desktop&r=svg|canvas -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#EEE7EC}
#city{position:fixed;left:0;top:0;transform-origin:0 0;background:center/cover no-repeat;will-change:transform}
#lot{position:fixed;inset:0}
#lot svg,#lot canvas{display:block}
</style></head><body><div id="city"></div><div id="lot"></div>
<script src="../lib/handoff.js"></script>
<script>
const q = new URLSearchParams(location.search), D = q.get("d") || "A", AB = q.get("ab") || (innerWidth < innerHeight ? "phone" : "desktop"), R = q.get("r") || "svg";
const city = document.getElementById("city");
city.style.backgroundImage = `url(../../_lib/city-${AB}.jpg)`;
const s = document.createElement("script"); s.src = R === "canvas" ? "../../_lib/lottie_light_canvas.min.js" : "../../_lib/lottie_svg.min.js";
s.onload = async () => {
  const data = await (await fetch(`../../${D}/${AB}.json?${Date.now()}`)).json();
  window.data = data;
  city.style.width = data.w + "px"; city.style.height = data.h + "px";
  window.anim = lottie.loadAnimation({ container: document.getElementById("lot"), renderer: R, loop: false, autoplay: false, animationData: JSON.parse(JSON.stringify(data)), assetsPath: `../../${D}/`, rendererSettings: { preserveAspectRatio: "xMidYMid slice", progressiveLoad: false } });
  anim.addEventListener("DOMLoaded", () => { window.ready = 1; window.meta = { op: data.op, fr: data.fr, markers: data.markers }; });
  anim.addEventListener("enterFrame", (e) => { city.style.transform = cromaticHandoff.cityTransform(data, e.currentTime, innerWidth, innerHeight); });
};
document.head.appendChild(s);
window.go = (frame) => { anim.goToAndStop(frame, true); city.style.transform = cromaticHandoff.cityTransform(data, frame, innerWidth, innerHeight); };
</script></body></html>
